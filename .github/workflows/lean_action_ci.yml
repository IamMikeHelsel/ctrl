name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Check-only: no Pages deploy or other writes. The site deploys from the `site` branch.
permissions:
  contents: read

# A newer push to the same ref supersedes any run still queued or in progress.
concurrency:
  group: lean-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ fromJSON(vars.RUNNER || '["self-hosted","ARM64","ctrl-local"]') }}

    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
