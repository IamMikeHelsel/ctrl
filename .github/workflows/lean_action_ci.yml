name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Check-only: no Pages deploy or other writes (workflows only check).
permissions:
  contents: read

jobs:
  build:
    # Self-hosted runner on sparky (ARM64); no GitHub-hosted runners for private repos.
    runs-on: [self-hosted, ARM64, ctrl-local]

    steps:
      - uses: actions/checkout@v7
        with:
          clean: false  # keep the gitignored .lake (Mathlib) between runs
      - uses: leanprover/lean-action@v1
