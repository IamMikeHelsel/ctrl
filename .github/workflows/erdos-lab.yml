name: Erdős lab checks

# Check-only (lint, tests, Lean audit). Never pushes, merges or writes anywhere.
# Runs on the self-hosted runner on sparky (no GitHub-hosted runners for private repos), but the
# gates themselves run inside docker/erdos-lab.Dockerfile with no network, as a non-root user, and
# without the host's $HOME, so nothing a job runs (including agent-written proofs) can leave state
# behind for later jobs. Trust boundary: this repo is private and non-fork (add-runner.sh refuses
# public repos), so only collaborators can trigger it. Note the runner user is in the docker group.
on:
  pull_request:
    paths: ["erdos/**", "src/**", "tests/**", "work/**", "docker/**", "pyproject.toml", "uv.lock", ".github/workflows/erdos-lab.yml"]
  push:
    branches: [main]
    paths: ["erdos/**", "src/**", "tests/**", "work/**", "docker/**", "pyproject.toml", "uv.lock", ".github/workflows/erdos-lab.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erdos-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: [self-hosted, ARM64, ctrl-local]
    timeout-minutes: 90
    env:
      IMAGE: erdos-lab:ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the test image (Mathlib cache lives in a cached layer)
        run: docker build -q -f docker/erdos-lab.Dockerfile -t "$IMAGE" .
      - name: Gates in the container (ruff, pytest, erdos check --all)
        run: docker run --rm --network none "$IMAGE"
      - name: Remove the image tag
        if: always()
        run: docker rmi -f "$IMAGE" >/dev/null 2>&1 || true
