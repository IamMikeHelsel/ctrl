name: Lint

# Persistent local hosts execute only trusted pushes or an explicitly reviewed commit.
# Fork PRs are reviewed/promoted by a maintainer; never approve their Actions runs.
# See docs/SELF_HOSTED_VERIFICATION.md for the required repository-level public gate.
on:
  push:
    branches: [main, 'ci/trusted/**']
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: 'Full 40-character commit SHA reviewed for execution on persistent local hosts'
        required: true
        type: string
      trust_acknowledgement:
        description: 'Type TRUSTED_LOCAL_EXECUTION after reviewing the entire commit and build inputs'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

# Lean is linted by the existing Lean Action CI (lake build with mathlib linters).
# This workflow covers the Python tooling (tools/ctrl_cli) and shell scripts.
jobs:
  python:
    if: >-
      github.repository == 'IamMikeHelsel/ctrl' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
        inputs.trust_acknowledgement == 'TRUSTED_LOCAL_EXECUTION'))
    runs-on: [self-hosted, ARM64, ctrl-local]
    timeout-minutes: 20
    steps:
      - name: Validate reviewed commit
        if: github.event_name == 'workflow_dispatch'
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        shell: bash
        run: |
          if [[ ! "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'reviewed_sha must be a full lowercase 40-character commit SHA' >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.reviewed_sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: ruff format
        # Python sources only; newer ruff also formats code blocks inside Markdown docs.
        run: git ls-files -z '*.py' '*.pyi' | xargs -0 -r uvx ruff format --check --force-exclude
      - name: ruff check
        # TODO: make blocking once existing findings are fixed
        continue-on-error: true
        run: git ls-files -z '*.py' '*.pyi' | xargs -0 -r uvx ruff check --force-exclude --output-format=github

  shell:
    if: >-
      github.repository == 'IamMikeHelsel/ctrl' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
        inputs.trust_acknowledgement == 'TRUSTED_LOCAL_EXECUTION'))
    runs-on: [self-hosted, ARM64, ctrl-local]
    timeout-minutes: 20
    steps:
      - name: Validate reviewed commit
        if: github.event_name == 'workflow_dispatch'
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        shell: bash
        run: |
          if [[ ! "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'reviewed_sha must be a full lowercase 40-character commit SHA' >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.reviewed_sha || github.sha }}
          persist-credentials: false
      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null; then
            case "$(uname -m)" in
              aarch64|arm64) arch=aarch64 ;;
              *) arch=x86_64 ;;
            esac
            case "$(uname -s)" in
              Darwin) os=darwin ;;
              *) os=linux ;;
            esac
            v=v0.10.0
            curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${v}/shellcheck-${v}.${os}.${arch}.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/shellcheck-${v}" >> "$GITHUB_PATH"
          fi
      - name: shellcheck
        # TODO: make blocking once existing findings are fixed
        continue-on-error: true
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck -x
