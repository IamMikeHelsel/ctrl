[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctrl"
version = "0.1.0"
description = "Machine-checked Lean proofs of Erdős problems, and the evidence that they prove the right statement."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "rich>=13.7,<16",
  "typer>=0.15,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
ctrl = "ctrl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ctrl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: touches real Lean or SSH (run with -m integration)"]

[tool.ruff]
line-length = 100
extend-exclude = ["lean", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "E741"]
