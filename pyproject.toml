[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctrl"
version = "0.1.0"
description = "Machine-checked Lean proofs of Erdős problems, and the evidence that they prove the right statement."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "arxiv>=4.0.1",
  "bibtexparser>=2.1.0",
  "clarabel>=0.11.1",
  "control>=0.10.2",
  "cvxpy>=1.9.3",
  "cypari2>=2.2.2",
  "jinja2>=3.1.6",
  "matplotlib>=3.11.2",
  "mpmath>=1.3.0",
  "mujoco>=3.16.0",
  "networkx>=3.6.1",
  "numpy>=2.4.6",
  "ortools>=9.15.6755",
  "osqp>=1.1.3",
  "pandas>=3.0.6",
  "pylatexenc>=2.11",
  "pymupdf>=2.0",
  "pypdf>=6.21.1",
  "python-flint>=0.9.0",
  "python-sat>=1.9.dev17",
  "rich>=13.7,<16",
  "scipy>=1.17.1",
  "scs>=3.3.1",
  "seaborn>=0.13.2",
  "sympy>=1.14.0",
  "tabulate>=0.10.0",
  "typer>=0.15,<1",
  "z3-solver>=5.3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
    "sympy>=1.14.0",
]

[project.scripts]
ctrl = "ctrl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ctrl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: touches real Lean or SSH (run with -m integration)"]

[tool.ruff]
line-length = 100
extend-exclude = ["lean", "tools", "work", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "E741"]
