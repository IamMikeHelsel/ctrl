        - complementary [ref=f5e66]:
          - strong [ref=f5e67]: The implementation boundary is still open.
          - text: The Python theorem registry checks that named declarations exist and scans for selected forbidden proof tokens. It does not compile the proof, inspect all dependencies, or prove that a Python function implements the theorem. The C differential checks compare selected outputs with Python; they are not a formal refinement proof or a worst-case timing measurement.
      - region [ref=f5e68]:
        - 'heading "An example: contact forces under a simple stance model" [level=2] [ref=f5e69]'
        - paragraph [ref=f5e70]: The existing contact-force work is a useful place to see the boundary. The model uses four contact points in a rectangle, a fixed center-of-mass height, positive dimensions and gravity, and a friction coefficient. It studies a particular bilinear force allocation.
        - generic [ref=f5e71]:
          - article [ref=f5e72]:
            - generic [ref=f5e73]: Mathematical statement
            - heading "Balance and cone membership" [level=3] [ref=f5e74]
            - paragraph [ref=f5e75]:
              - code [ref=f5e76]: Research/LorentzConeCBF.lean
              - text: contains statements for net force, zero net torque, and individual contact-force membership in a friction cone.
            - paragraph [ref=f5e77]: "The cone result requires both support bounds and a friction bound:"
            - generic "Required acceleration bounds" [ref=f5e78]:
              - code [ref=f5e79]: hG · |ax| ≤ g · Wx hG · |ay| ≤ g · Wy ax² + ay² ≤ (μ · g)²
            - paragraph [ref=f5e80]: Those are hypotheses to establish for the commanded acceleration. The one-axis braking limit alone does not cover every two-axis command.
          - article [ref=f5e81]:
            - generic [ref=f5e82]: Experiment boundary
            - heading "A rigid-body demonstration" [level=3] [ref=f5e83]
            - paragraph [ref=f5e84]: The current MuJoCo example applies the computed net wrench directly to a free trunk. Contact sites mark the rectangle; the model does not simulate articulated legs, a ground-contact solver, or actuator dynamics.
            - paragraph [ref=f5e85]: A useful next test would add contact and actuation limits, delayed state, and model error, then compare matched controllers using the same constraints.
            - paragraph [ref=f5e86]: No physical quadruped safety result or measured advantage over a QP/SOCP controller is established by this example.
      - region [ref=f5e87]:
        - heading "Research areas and plausible uses" [level=2] [ref=f5e88]
        - paragraph [ref=f5e89]: These are directions for investigation, not packaged capabilities. Expected improvements are expressed as quantities to measure; no general percentage gain is promised.
        - generic [ref=f5e90]:
          - article [ref=f5e91]:
            - generic [ref=f5e92]: Control × mechanics
            - heading "Trajectory shape and effort" [level=3] [ref=f5e93]
            - paragraph [ref=f5e94]: Polynomial trajectories, passivity, and inverse dynamics may help reduce motion effort while preserving a task's timing and endpoint constraints.
            - generic [ref=f5e95]:
              - term [ref=f5e96]: Measure
              - definition [ref=f5e97]: Total energy, peak torque, tracking error, and move duration.
              - term [ref=f5e98]: Open limit
              - definition [ref=f5e99]: Squared-torque and viscous-loss proxies are not measurements of a real motor's total energy.
          - article [ref=f5e100]:
            - generic [ref=f5e101]: Geometry × perception
            - heading "State estimates that respect geometry" [level=3] [ref=f5e102]
            - paragraph [ref=f5e103]: Projective geometry, rigid transforms, and covariance algebra offer tools for visual servoing and sensor fusion.
            - generic [ref=f5e104]:
              - term [ref=f5e105]: Measure
              - definition [ref=f5e106]: Pose error, consistency, convergence, and lost-track recovery.
              - term [ref=f5e107]: Open limit
              - definition [ref=f5e108]: Algebraic pose or depth examples do not validate detection, correspondence, occlusion handling, or calibration.
          - article [ref=f5e109]:
            - generic [ref=f5e110]: Timing × system state
            - heading "Make data age part of the model" [level=3] [ref=f5e111]
            - paragraph [ref=f5e112]: Timestamp uncertainty, prediction bounds, and state provenance may make stale measurements easier to detect and accommodate.
            - generic [ref=f5e113]:
              - term [ref=f5e114]: Measure
              - definition [ref=f5e115]: Prediction error, margin consumption, stale-data rejection, and availability.
              - term [ref=f5e116]: Open limit
              - definition [ref=f5e117]: Clock, acceleration, and error bounds need evidence from the actual data path and plant.
          - article [ref=f5e118]:
            - generic [ref=f5e119]: Optimization × planning
            - heading "Feasibility that survives the next step" [level=3] [ref=f5e120]
            - paragraph [ref=f5e121]: Reachability, invariant sets, and model-predictive-control arguments can guide planning under uncertainty.
            - generic [ref=f5e122]:
              - term [ref=f5e123]: Measure
              - definition [ref=f5e124]: Feasibility, completion rate, clearance, and computation time.
              - term [ref=f5e125]: Open limit
              - definition [ref=f5e126]: A finite-horizon planning example does not settle long-horizon behavior or out-of-distribution obstacles.
          - article [ref=f5e127]:
            - generic [ref=f5e128]: Robust control × system safety
            - heading "Fallbacks with explicit obligations" [level=3] [ref=f5e129]
            - paragraph [ref=f5e130]: Barrier functions and Simplex-style switching expose the conditions a fallback must satisfy to preserve a modeled safe set.
            - generic [ref=f5e131]:
              - term [ref=f5e132]: Measure
              - definition [ref=f5e133]: Interventions, violations, fallback availability, and deadline misses.
              - term [ref=f5e134]: Open limit
              - definition [ref=f5e135]: Fallback invariance and an accurate transition model are assumptions to discharge, not consequences of naming a theorem.
          - article [ref=f5e136]:
            - generic [ref=f5e137]: Linear algebra × data manipulation
            - heading "Check transformations before composing them" [level=3] [ref=f5e138]
            - paragraph [ref=f5e139]: Information-form updates, conditioning bounds, and exact arithmetic can help test whether data transformations preserve their intended meaning.
            - generic [ref=f5e140]:
              - term [ref=f5e141]: Measure
              - definition [ref=f5e142]: Residuals, conditioning, uncertainty calibration, and throughput.
              - term [ref=f5e143]: Open limit
              - definition [ref=f5e144]: Shared sensor errors, frame conventions, units, and numerical precision can invalidate a correct algebraic identity's application.
