      - region [ref=f5e34]:
        - heading "A proof is only as useful as the statement it proves" [level=2] [ref=f5e35]
        - paragraph [ref=f5e36]: ctrl brings together Lean source, Python reference routines, generated C99 and Structured Text, and selected simulations. These artifacts answer different questions. A theorem about real numbers does not by itself verify a floating-point controller or a physical robot.
