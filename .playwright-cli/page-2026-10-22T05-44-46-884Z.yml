        - list [ref=e261]:
          - listitem [ref=e262]:
            - strong [ref=e263]: Read the actual result.
            - text: Freeze source version, claim location, assumptions and inspected scope. An abstract can suggest a lead.
          - listitem [ref=e264]:
            - strong [ref=e265]: Identify the missing bridge.
            - text: Connect mathematical object, physical model, available measurements and executable check.
          - listitem [ref=e266]:
            - strong [ref=e267]: Build a falsifiable slice.
            - text: Specify a fair baseline, units, admissible cases and failure conditions before measuring.
          - listitem [ref=e268]:
            - strong [ref=e269]: Have another reviewer try to break it.
            - text: Include boundary conditions, malformed witnesses, stale state and mismatched assumptions.
          - listitem [ref=e270]:
            - strong [ref=e271]: Publish the bounded conclusion.
            - text: Save replay commands and results. Write-ups and animations explain only what the evidence supports.
        - paragraph [ref=e272]: "Next priorities: integrate bounded state age without double-counting delay; test transport certificates against independent assignment optima; investigate pose-certificate reconstruction. Broader closed-loop, sensor and hardware studies follow only if those slices hold up."
        - paragraph [ref=e273]: A release requires an exact reviewed revision, passing checks, source and licensing review, and consistent claims across code, documentation and site. Public repository availability is a separate decision.
