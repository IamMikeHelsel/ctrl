          - listitem [ref=f4e266]:
            - strong [ref=f4e267]: Build a falsifiable slice.
            - text: Specify a fair baseline, units, admissible cases and failure conditions before measuring.
          - listitem [ref=f4e268]:
            - strong [ref=f4e269]: Have another reviewer try to break it.
            - text: Include boundary conditions, malformed witnesses, stale state and mismatched assumptions.
          - listitem [ref=f4e270]:
            - strong [ref=f4e271]: Publish the bounded conclusion.
            - text: Save replay commands and results. Write-ups and animations explain only what the evidence supports.
