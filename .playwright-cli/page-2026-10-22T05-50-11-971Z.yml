      - generic [ref=f3e8]: Study 02 · exact finite arithmetic + a formal inequality
      - heading "An assignment can carry its own cost gap." [level=1] [ref=f3e9]
      - paragraph [ref=f3e10]: Check conservation and dual feasibility before trusting an allocation. The prototype reports an honest interval for the optimal cost, including when the submitted assignment is poor.
