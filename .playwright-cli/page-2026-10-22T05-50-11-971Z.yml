    - main [ref=f3e16]:
      - generic [ref=f3e17]:
        - heading "Separate the search from the check" [level=2] [ref=f3e18]
        - paragraph [ref=f3e19]: A transport plan sends nonnegative mass from source bins to target bins. Row and column sums must match the specified marginals. A candidate plan supplies an upper bound on the best possible cost. Feasible dual potentials supply a lower bound.
        - generic [ref=f3e20]:
          - article [ref=f3e21]:
            - heading "Primal obligations" [level=3] [ref=f3e22]
            - code [ref=f3e24]: p[i,j] ≥ 0 Σj p[i,j] = source_mass[i] Σi p[i,j] = target_mass[j] U = Σij p[i,j] cost[i,j]
            - paragraph [ref=f3e25]: Costs can be negative. Total mass must be positive and balanced; it need not equal one.
          - article [ref=f3e26]:
            - heading "Dual obligations" [level=3] [ref=f3e27]
            - code [ref=f3e29]: u[i] + v[j] ≤ cost[i,j] for every pair L = Σi source_mass[i] u[i] + Σj target_mass[j] v[j] L ≤ optimal cost ≤ U
            - paragraph [ref=f3e30]: Check every pair, including edges a partitioned search did not use. Otherwise a restricted problem can silently replace the intended one.
        - complementary [ref=f3e31]:
          - text: Motivated by
          - link "partitioned transport for multi-agent distribution matching" [ref=f3e32] [cursor=pointer]:
            - /url: https://arxiv.org/abs/2609.38960
          - text: and the search/check separation in
          - link "CP-Cert for pose registration" [ref=f3e33] [cursor=pointer]:
            - /url: https://arxiv.org/abs/2609.03222
          - text: . Weak duality is standard mathematics. This prototype reproduces neither paper's full method nor its performance results.
      - generic [ref=f3e34]:
        - heading "Small results with inspectable witnesses" [level=2] [ref=f3e35]
        - paragraph [ref=f3e36]: Synthetic source coordinates [0, 1, 10, 11], target coordinates [1, 2, 11, 12], squared distance costs and equal masses. Coordinates are unitless. Every example has an independently enumerated optimal cost of 1.
        - region "Transport certificate results" [ref=f3e37]:
          - table [ref=f3e38]:
            - caption [ref=f3e39]: An accepted interval does not mean the submitted plan is optimal. Exact zero gap is required for that label.
