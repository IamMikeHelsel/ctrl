        - generic [ref=f3e58]:
          - article [ref=f3e59]:
            - generic [ref=f3e60]: Executable checks
            - heading "Independent tiny-instance oracle" [level=3] [ref=f3e61]
            - paragraph [ref=f3e62]: Across 24 seeded integer-cost instances of size 2–5, all 912 candidate intervals enclosed the enumerated optimum. The witness generator rejected 884 strictly suboptimal assignments as candidates for a tight dual.
            - paragraph [ref=f3e63]: Six corrupted or malformed study inputs were rejected. A rectangular mass-splitting example also produced an exact [¼, ¼] interval. Eighteen focused tests pass.
          - article [ref=f3e64]:
            - generic [ref=f3e65]: Formal model
            - heading "Finite rational weak duality" [level=3] [ref=f3e66]
            - paragraph [ref=f3e67]:
              - text: A separate Lean file proves the finite transport weak-duality inequality and a candidate-gap implication. Both compile with only
              - code [ref=f3e68]: propext
              - text: ","
              - code [ref=f3e69]: Classical.choice
              - text: and
              - code [ref=f3e70]: Quot.sound
              - text: .
            - paragraph [ref=f3e71]: The second implication assumes a candidate-cost upper bound; candidate feasibility is a separate obligation. Individual Python witnesses have not been replayed in Lean.
      - generic [ref=f3e72]:
        - heading "Where it could be useful—and what is missing" [level=2] [ref=f3e73]
        - paragraph [ref=f3e74]: A future allocation component could attach a checked gap to a fast partitioned result, then decide whether a global solve is worth the cost. The useful measurements would be gap quality, checker time, witness size and total computation saved under identical inputs.
        - paragraph [ref=f3e75]: This pass has not measured a speedup. It establishes no motion dynamics, collision avoidance, deadline guarantee, sensor robustness or floating-point refinement. Tiny uniform assignment enumeration does not validate every transport problem. A low assignment cost is not a navigation safety result.
        - paragraph [ref=f3e76]:
          - strong [ref=f3e77]: "Next falsifier:"
          - text: export exact witnesses from realistic costs and partitions, replay them in Lean, and compare the checking overhead with solver time saved. If the gaps are too wide or checking erases the saving, defer the integration.
