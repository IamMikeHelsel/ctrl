    - main [ref=f1e17]:
      - generic [ref=f1e18]:
        - heading "The model and the question" [level=2] [ref=f1e19]
        - paragraph [ref=f1e20]: Consider a point mass moving toward a stationary wall. An admission rule asks whether its available clearance covers a worst-case stop. It does not issue a command or recover a state that is already too close.
        - generic [ref=f1e21]:
          - article [ref=f1e22]:
            - heading "Declared assumptions" [level=3] [ref=f1e23]
            - list [ref=f1e24]:
              - listitem [ref=f1e25]: One-dimensional forward motion; no turns or moving obstacle.
              - listitem [ref=f1e26]: Position error is at most ε; speed is at most u = v̂ + δv at observation time.
              - listitem [ref=f1e27]: Total delay τ includes state age, computation, transport and actuator reaction.
              - listitem [ref=f1e28]: Forward acceleration during the delay is at most A.
              - listitem [ref=f1e29]: After the delay, deceleration is at least b > 0 until rest; rest is then held.
          - article [ref=f1e30]:
            - heading "Required clearance" [level=3] [ref=f1e31]
            - paragraph [ref=f1e32]: D = ε + uτ + ½Aτ² + (u + Aτ)² / (2b)
            - paragraph [ref=f1e33]: The terms are position uncertainty, motion during reaction, and braking after reaction. This is familiar constant-acceleration algebra.
            - paragraph [ref=f1e34]: A real plant needs valid bounds and a dynamics-to-envelope argument. The new Lean file proves the explicit polynomial bounds, not that a robot follows them.
        - complementary [ref=f1e35]:
          - strong [ref=f1e36]: The literature connection.
          - text: Recent work studies
          - link "computation delays in safety filters" [ref=f1e37] [cursor=pointer]:
            - /url: https://arxiv.org/abs/2610.10797
          - text: and
          - link "escape maneuvers under actuator limits" [ref=f1e38] [cursor=pointer]:
            - /url: https://arxiv.org/abs/2609.17292
          - text: . Those papers motivate this reduced experiment. This study does not reproduce their algorithms or claim their guarantees.
