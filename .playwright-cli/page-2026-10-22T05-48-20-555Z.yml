        - paragraph [ref=f1e132]:
          - strong [ref=f1e133]: "Next experiment:"
          - text: connect the existing timestamped-state sink to a delay budget with explicit clock and actuator contracts. Compare freshness-only rejection with model-based margins under matched latency traces; measure false admissions, availability and unnecessary rejection. A smaller margin is useful only if its input bounds remain valid.
      - generic [ref=f1e134]:
        - heading "One useful sensitivity question" [level=2] [ref=f1e135]
        - paragraph [ref=f1e136]: In the specified example, reducing total delay by 20 ms saves exactly 38.7 mm of required clearance. Reducing the speed-error bound by 0.02 m/s and the position-error bound by 10 mm together saves 26.9 mm. These are hypothetical changes with the other inputs fixed, not measured engineering improvements or a comparison of implementation cost.
        - paragraph [ref=f1e137]: That suggests testing the timestamp-to-brake path before adding model complexity. Improving an assumed bound on paper is not evidence that the system improved.
