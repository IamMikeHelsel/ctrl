      - heading "A stopping rule needs a clock." [level=1] [ref=f1e9]
      - paragraph [ref=f1e10]: A 0.25 m nominal stop becomes 0.6825 m when this example includes speed uncertainty, position error and reaction delay. The value of the exercise is making those assumptions inspectable.
