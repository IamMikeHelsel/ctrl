            - heading "Check transformations before composing them" [level=3] [ref=f2e138]
            - paragraph [ref=f2e139]: Information-form updates, conditioning bounds, and exact arithmetic can help test whether data transformations preserve their intended meaning.
            - generic [ref=f2e140]:
              - term [ref=f2e141]: Measure
              - definition [ref=f2e142]: Residuals, conditioning, uncertainty calibration, and throughput.
              - term [ref=f2e143]: Open limit
              - definition [ref=f2e144]: Shared sensor errors, frame conventions, units, and numerical precision can invalidate a correct algebraic identity's application.
