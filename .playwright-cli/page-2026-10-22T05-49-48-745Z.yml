          - text: The Python theorem registry checks that named declarations exist and scans for selected forbidden proof tokens. It does not compile the proof, inspect all dependencies, or prove that a Python function implements the theorem. The C differential checks compare selected outputs with Python; they are not a formal refinement proof or a worst-case timing measurement.
      - region [ref=f2e68]:
        - 'heading "An example: contact forces under a simple stance model" [level=2] [ref=f2e69]'
        - paragraph [ref=f2e70]: The existing contact-force work is a useful place to see the boundary. The model uses four contact points in a rectangle, a fixed center-of-mass height, positive dimensions and gravity, and a friction coefficient. It studies a particular bilinear force allocation.
        - generic [ref=f2e71]:
          - article [ref=f2e72]:
            - generic [ref=f2e73]: Mathematical statement
            - heading "Balance and cone membership" [level=3] [ref=f2e74]
            - paragraph [ref=f2e75]:
              - code [ref=f2e76]: Research/LorentzConeCBF.lean
              - text: contains statements for net force, zero net torque, and individual contact-force membership in a friction cone.
            - paragraph [ref=f2e77]: "The cone result requires both support bounds and a friction bound:"
            - generic "Required acceleration bounds" [ref=f2e78]:
              - code [ref=f2e79]: hG · |ax| ≤ g · Wx hG · |ay| ≤ g · Wy ax² + ay² ≤ (μ · g)²
            - paragraph [ref=f2e80]: Those are hypotheses to establish for the commanded acceleration. The one-axis braking limit alone does not cover every two-axis command.
          - article [ref=f2e81]:
            - generic [ref=f2e82]: Experiment boundary
            - heading "A rigid-body demonstration" [level=3] [ref=f2e83]
            - paragraph [ref=f2e84]: The current MuJoCo example applies the computed net wrench directly to a free trunk. Contact sites mark the rectangle; the model does not simulate articulated legs, a ground-contact solver, or actuator dynamics.
            - paragraph [ref=f2e85]: A useful next test would add contact and actuation limits, delayed state, and model error, then compare matched controllers using the same constraints.
            - paragraph [ref=f2e86]: No physical quadruped safety result or measured advantage over a QP/SOCP controller is established by this example.
      - region [ref=f2e87]:
        - heading "Research areas and plausible uses" [level=2] [ref=f2e88]
        - paragraph [ref=f2e89]: These are directions for investigation, not packaged capabilities. Expected improvements are expressed as quantities to measure; no general percentage gain is promised.
        - generic [ref=f2e90]:
          - article [ref=f2e91]:
            - generic [ref=f2e92]: Control × mechanics
            - heading "Trajectory shape and effort" [level=3] [ref=f2e93]
            - paragraph [ref=f2e94]: Polynomial trajectories, passivity, and inverse dynamics may help reduce motion effort while preserving a task's timing and endpoint constraints.
            - generic [ref=f2e95]:
              - term [ref=f2e96]: Measure
              - definition [ref=f2e97]: Total energy, peak torque, tracking error, and move duration.
              - term [ref=f2e98]: Open limit
              - definition [ref=f2e99]: Squared-torque and viscous-loss proxies are not measurements of a real motor's total energy.
          - article [ref=f2e100]:
            - generic [ref=f2e101]: Geometry × perception
            - heading "State estimates that respect geometry" [level=3] [ref=f2e102]
            - paragraph [ref=f2e103]: Projective geometry, rigid transforms, and covariance algebra offer tools for visual servoing and sensor fusion.
            - generic [ref=f2e104]:
              - term [ref=f2e105]: Measure
              - definition [ref=f2e106]: Pose error, consistency, convergence, and lost-track recovery.
              - term [ref=f2e107]: Open limit
              - definition [ref=f2e108]: Algebraic pose or depth examples do not validate detection, correspondence, occlusion handling, or calibration.
          - article [ref=f2e109]:
            - generic [ref=f2e110]: Timing × system state
            - heading "Make data age part of the model" [level=3] [ref=f2e111]
            - paragraph [ref=f2e112]: Timestamp uncertainty, prediction bounds, and state provenance may make stale measurements easier to detect and accommodate.
            - generic [ref=f2e113]:
              - term [ref=f2e114]: Measure
              - definition [ref=f2e115]: Prediction error, margin consumption, stale-data rejection, and availability.
              - term [ref=f2e116]: Open limit
              - definition [ref=f2e117]: Clock, acceleration, and error bounds need evidence from the actual data path and plant.
          - article [ref=f2e118]:
            - generic [ref=f2e119]: Optimization × planning
            - heading "Feasibility that survives the next step" [level=3] [ref=f2e120]
            - paragraph [ref=f2e121]: Reachability, invariant sets, and model-predictive-control arguments can guide planning under uncertainty.
            - generic [ref=f2e122]:
              - term [ref=f2e123]: Measure
              - definition [ref=f2e124]: Feasibility, completion rate, clearance, and computation time.
              - term [ref=f2e125]: Open limit
              - definition [ref=f2e126]: A finite-horizon planning example does not settle long-horizon behavior or out-of-distribution obstacles.
          - article [ref=f2e127]:
            - generic [ref=f2e128]: Robust control × system safety
            - heading "Fallbacks with explicit obligations" [level=3] [ref=f2e129]
            - paragraph [ref=f2e130]: Barrier functions and Simplex-style switching expose the conditions a fallback must satisfy to preserve a modeled safe set.
            - generic [ref=f2e131]:
              - term [ref=f2e132]: Measure
              - definition [ref=f2e133]: Interventions, violations, fallback availability, and deadline misses.
              - term [ref=f2e134]: Open limit
              - definition [ref=f2e135]: Fallback invariance and an accurate transition model are assumptions to discharge, not consequences of naming a theorem.
          - article [ref=f2e136]:
